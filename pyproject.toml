[project]
name = "kae-steering"
version = "0.1.0"
description = "A-LQR activation steering and measured drift cancellation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "torch",
    "tqdm",
    "transformers",
]

[dependency-groups]
dev = ["ipykernel", "ipywidgets", "nbclient", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extensions", "steer"]
