[project]
name = "kae-steering"
version = "0.1.0"
description = "A-LQR activation steering and linear prediction of transformer states"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate",
    "matplotlib",
    "numpy",
    "pandas",
    "torch",
    "tqdm",
    "transformers",
]

[dependency-groups]
dev = ["ipykernel", "nbclient", "pytest"]
