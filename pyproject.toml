[project]
name = "kae-steering"
version = "0.1.0"
description = "Streaming Koopman surrogates for Gemma activations"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate",
    "datasets==4.4.2",
    "huggingface-hub",
    "jinja2==3.1.6",
    "numpy",
    "protobuf",
    "pyarrow",
    "sentencepiece",
    "torch==2.9.1",
    "transformers==4.57.1",
    "wandb",
]

[dependency-groups]
# Original A-LQR/S-PID scripts under steer/; not needed for KAE training.
baseline = [
    "bitsandbytes",
    "evaluate",
    "matplotlib",
    "nltk",
    "pandas",
    "pyyaml",
    "requests",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "tqdm",
]
