# MLP KAE: reconstruction, state/latent rollouts, KL, and later-start state MSE.
validation_cache = "data/activations/gemma3-4b"
output_dir = "runs/gemma3-4b-mlp-100ep"
dataset = "HuggingFaceFW/fineweb-edu"
dataset_config = "sample-10BT"
dataset_split = "train"
dataset_revision = "87f09149ef4734204d70ed1d046ddc9ca3f2b8f9"
text_column = "text"

# Each epoch consumes new documents rather than replaying these 4,096 documents.
docs_per_epoch = 4096
epochs = 100
batch_size = 32
teacher_batch_size = 8
min_truncation = 2
teacher_precision = "bfloat16"

# Plain Linear-GELU-Linear encoder and decoder; no invertible flow.
# The hidden MLP is at least as wide as the 2,560-dimensional teacher state.
architecture = "mlp"
latent_width = 5120
mlp_width = 2560
operator = "layerwise"
student_normalization = "none"
context_width = 0

# Same optimizer and schedule as the AIKAE recipe; train from scratch.
learning_rate = 1e-4
muon_lr_multiplier = 1.5
warmup_fraction = 0.05
grad_clip = 1.0

# Preserve reconstruction/state/KL weights; give latent consistency useful pressure.
# Later-start state supplements the main rollout without dominating it.
reconstruction_weight = 0.001
state_weight = 0.001
latent_weight = 0.01
kl_weight = 2.5
multistart_state_weight = 0.00005
multistart_latent_weight = 0.0

validate_every = 1
seed = 1729
wandb = true
wandb_base_url = "https://api.wandb.ai"
wandb_entity = "nishantaswani"
run_name = "Gemma3-4B-MLP-streaming4k-100ep-latent-multistart"
progress_every_seconds = 60
